name: Bug report
description: Something on the dashboard is wrong, missing, or broken.
labels: [bug]
assignees: [Villunus]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What went wrong?
      description: |
        A sentence is fine. If you came from **Report a bug** in the app, click **Copy** in the small window it
        opened, then click in this box and press Ctrl+V to attach the diagnostics. Player names are removed from
        them, but your own hand is included.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Filled in by the app.
  - type: input
    id: game
    attributes:
      label: Game
      description: Filled in by the app.
